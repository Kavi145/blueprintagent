databases:
  - name: blueprintagent-db
    databaseName: blueprintagent_db
    user: blueprintagent_user

services:
  - type: web
    name: blueprintagent-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blueprintagent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false