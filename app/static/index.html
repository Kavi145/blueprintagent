<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueprintAgent Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.25rem; color: #38bdf8; }
        #chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .message { padding: 1rem; border-radius: 12px; max-width: 85%; line-height: 1.5; word-break: break-word; }
        .user-message { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .loading { font-style: italic; color: #94a3b8; }
        #input-container { background: #1e293b; padding: 1.5rem; border-top: 1px solid #334155; display: flex; justify-content: center; }
        .input-wrapper { max-width: 800px; width: 100%; display: flex; gap: 0.75rem; }
        input { flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { background: #0284c7; color: white; border: none; padding: 0 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .download-btn { display: inline-block; margin-top: 0.75rem; background: #10b981; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .download-btn:hover { background: #059669; }
        ul { margin: 0.5rem 0; padding-left: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>BlueprintAgent AI</h1>
        <span style="font-size: 0.85rem; color: #94a3b8;">Autonomous Planning & Document Generation</span>
    </header>

    <div id="chat-container">
        <div class="message bot-message">
            Hello! I am your BlueprintAgent. Describe the project or workflow you want to build, and I will generate a complete execution plan and downloadable Word document for you.
        </div>
    </div>

    <div id="input-container">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="e.g., Build a mobile app for local food delivery..." autofocus>
            <button onclick="sendRequest()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendRequest();
        });

        async function sendRequest() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage(text, 'user-message');
            userInput.value = '';

            // Show Loading Indicator
            const loadingId = appendMessage('Thinking and generating execution plan...', 'bot-message loading');

            try {
                const response = await fetch('/projects/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_request: text })
                });

                if (!response.ok) throw new Error('Failed to generate blueprint.');

                const data = await response.json();
                
                // Remove loading message
                document.getElementById(loadingId).remove();

                // Format Bot Response
                renderBlueprintResponse(data);

            } catch (error) {
                document.getElementById(loadingId).innerText = 'Error: Could not generate blueprint. Please try again.';
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.innerHTML = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function renderBlueprintResponse(data) {
            const plan = data.plan_data;
            let html = `<strong>📋 ${plan.title || 'Project Blueprint'}</strong><br><br>`;
            
            html += `<strong>Objectives:</strong><ul>`;
            (plan.objectives || []).forEach(o => html += `<li>${o}</li>`);
            html += `</ul>`;

            html += `<strong>Execution Tasks:</strong><ul>`;
            (plan.tasks || []).forEach(t => html += `<li><b>${t.name}</b> (${t.timeline}): ${t.description}</li>`);
            html += `</ul>`;

            html += `<strong>Execution Strategy:</strong><p>${plan.execution_strategy || ''}</p>`;
            
            // Add download button for Word document
            html += `<a href="/projects/${data.id}/download" class="download-btn" target="_blank">📥 Download Word Document (.docx)</a>`;

            appendMessage(html, 'bot-message');
        }
    </script>
</body>
</html>
